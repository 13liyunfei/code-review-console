name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 前端构建产物（src/main/resources/static）已随仓库提交，开箱即用；
      # 如需重新构建前端：cd frontend && npm install && npm run build
      - name: Build with Maven
        run: ./mvnw -B package -DskipTests
